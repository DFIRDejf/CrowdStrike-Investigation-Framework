name: CQL Library QA & Catalog Sync

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/cql-library-qa.yml'
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
    paths:
      - '**/*.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/cql-library-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Markdown & CQL structure
    if: github.event_name != 'push' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check generated files and structural QA
        run: python3 scripts/catalog.py --check

  sync:
    name: Update indexes on working branches
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Regenerate category, MITRE and global indexes
        run: |
          python3 scripts/catalog.py --write
          python3 scripts/catalog.py --check
      - name: Commit generated Markdown when needed
        shell: bash
        run: |
          git add README.md QUERY-CATALOG.md MITRE-TECHNIQUE-INDEX.md TELEMETRY-INDEX.md docs/QUERY-DUPLICATES.md
          git add -- '[0-9][0-9]-*/README.md'
          if git diff --cached --quiet; then
            echo 'All CQL indexes are up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: automatically sync CQL query indexes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
